name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exercise the production build path. Forks can override this with a
  # repository variable pointing at their own Render service.
  PROD_API_URL: ${{ vars.PROD_API_URL || 'https://ai-canva-22-nbn.onrender.com' }}

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Build server
        run: npm run build --prefix server

      - name: Build client
        run: VITE_API_BASE="${PROD_API_URL%/}/api" npm run build --prefix client

      - name: Run unit tests
        run: npm test

  ui-smoke:
    name: UI marker and smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Start dev servers
        run: |
          npm run dev > /tmp/relay-dev.log 2>&1 &
          echo $! > /tmp/relay-dev.pid

          for i in $(seq 1 60); do
            if [ -f .server-port ] \
              && curl -fsS "http://localhost:$(cat .server-port)/api/health" >/dev/null 2>&1 \
              && curl -fsS http://localhost:5173 >/dev/null 2>&1; then
              echo "Dev servers are ready."
              exit 0
            fi
            sleep 2
          done

          echo "Dev servers did not start."
          cat /tmp/relay-dev.log
          exit 1

      - name: Run marker checks
        working-directory: client
        run: node markers-check.mjs

      - name: Run UI smoke tests
        working-directory: client
        run: node ui-smoke.mjs

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-artifacts
          path: |
            /tmp/relay-restyle.png
            /tmp/relay-dev.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop dev servers
        if: always()
        run: |
          if [ -f /tmp/relay-dev.pid ]; then
            kill "$(cat /tmp/relay-dev.pid)" 2>/dev/null || true
          fi
          pkill -f "concurrently" || true
          pkill -f "vite" || true
          pkill -f "tsx watch" || true
